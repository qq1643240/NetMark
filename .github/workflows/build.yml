name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootless, roothide]
    env:
      SDK_VERSION: "14.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz dpkg

      # roothide 的打包 scheme 只存在于 roothide/theos 分支，
      # 它同时兼容 rootful / rootless / roothide 三种方案。
      - name: Install Theos (roothide fork)
        run: |
          git clone --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          cd "$HOME/theos"
          git submodule update --init --recursive --depth 1 \
            || git submodule update --init --recursive
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set "iPhoneOS${SDK_VERSION}.sdk"
          mkdir -p "$THEOS/sdks"
          cp -R "iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"

      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          echo "SCHEME=${{ matrix.scheme }}"
          xcodebuild -version
          ldid -v || true
          dpkg-deb --version | head -1

      - name: Build
        run: |
          make package THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} FINALPACKAGE=1
          mkdir -p out
          mv packages/*.deb out/

      - name: Inspect package
        run: |
          ls -lh out/
          for deb in out/*.deb; do
            echo "--- $deb"
            dpkg-deb -f "$deb" Package Version Architecture Depends
            dpkg-deb -c "$deb" | awk '{print $6}' | head -12
          done

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NetMark-${{ matrix.scheme }}
          path: out/*.deb
          if-no-files-found: error
